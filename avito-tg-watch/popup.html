<!doctype html><html lang="ru"><meta charset="utf-8"><title>Авито → ТГ</title><link rel="stylesheet" href="popup.css"><body>
<header><span class="tag">29WAY / TOOLS</span><h1>Авито <span>→</span> ТГ</h1><p>Чтобы клиент не потерялся среди вкладок.</p></header>
<label class="switch"><input id="enabled" type="checkbox"> Следить за сообщениями</label>
<label>Токен Telegram-бота<input id="token" type="password" placeholder="Из @BotFather" autocomplete="off"></label>
<label>Твой Chat ID<input id="chatId" placeholder="Например: 123456789" autocomplete="off"></label>
<label class="switch"><input id="desktop" type="checkbox"> Ещё уведомлять в Windows</label>
<div class="buttons"><button id="save">Сохранить</button><button id="test" class="secondary">Тест ТГ</button></div>
<section><h2>Проверка вкладки</h2><div id="status">Пока нет данных</div><div id="sent"></div><div class="buttons"><button id="scan" class="secondary">Проверить</button><button id="pick" class="secondary">Выбрать счётчик</button></div><button id="pickDetails" class="secondary">Настроить имена и текст</button><br><button id="auto" class="link">Вернуть автоопределение</button></section>
<div id="message" role="status"></div><footer>Оставь открытым список сообщений Авито. Компьютер и браузер должны работать. Проверка каждые ~30 секунд и при изменениях страницы. Это пробная версия: сначала проверь входящим сообщением.</footer><script src="popup.js"></script></body></html>
